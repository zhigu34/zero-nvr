name: zero-nvr

x-zero-nvr-common: &zero-nvr-common
  image: ${ZERO_NVR_IMAGE:-zero-nvr:local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - .env
  environment:
    ZERO_NVR_DATA_DIR: /var/lib/zero-nvr
    ZERO_NVR_CACHE_DIR: /var/cache/zero-nvr
    ZERO_NVR_RECORDINGS_DIR: /recordings
    ZERO_NVR_PREBUFFER_DIR: /prebuffer
    ZERO_NVR_HUEY_DB_PATH: /var/lib/zero-nvr/huey.db
    ZERO_NVR_DEPLOYMENT_CONFIG_DIR: /config/deployment
    ZERO_NVR_ZLM_BASE_URL: http://zlmediakit
    ZERO_NVR_ZLM_RTSP_BASE_URL: rtsp://zlmediakit:554
    ZERO_NVR_ZLM_RTMP_BASE_URL: rtmp://zlmediakit:1935
  volumes:
    - ${ZERO_NVR_DATA_PATH:-./data/zero-nvr}:/var/lib/zero-nvr
    - ${ZERO_NVR_CACHE_PATH:-./data/cache}:/var/cache/zero-nvr
    - ${ZERO_NVR_RECORDINGS_PATH:-./data/recordings}:/recordings
    - zero-nvr-prebuffer:/prebuffer
    - ./deploy:/config/deployment:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - zero-nvr

services:
  zero-nvr:
    <<: *zero-nvr-common
    command:
      - sh
      - -ec
      - |
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${ZERO_NVR_API_PORT:-8000}:8000"
    depends_on:
      zlmediakit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8000/health
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  zero-nvr-worker:
    <<: *zero-nvr-common
    command:
      - sh
      - -ec
      - |
        python -m app.cli check-schema
        exec huey_consumer.py app.worker.consumer.huey --workers "${ZERO_NVR_HUEY_WORKERS:-2}"
    depends_on:
      zero-nvr:
        condition: service_healthy

  frigate:
    profiles:
      - frigate
    image: ${ZERO_NVR_FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.18.0}
    env_file:
      - ${ZERO_NVR_DATA_PATH:-./data/zero-nvr}/managed/frigate/runtime.env
    shm_size: ${ZERO_NVR_FRIGATE_SHM_SIZE:-256mb}
    stop_grace_period: 30s
    volumes:
      - zero-nvr-frigate-config:/config
      - ${ZERO_NVR_DATA_PATH:-./data/zero-nvr}/managed/frigate/config.yml:/config/config.yml:ro
      - ${ZERO_NVR_CACHE_PATH:-./data/cache}/frigate:/media/frigate
    tmpfs:
      - /tmp/cache:size=1073741824
    ports:
      - "${ZERO_NVR_FRIGATE_BIND:-127.0.0.1}:${ZERO_NVR_FRIGATE_PORT:-8971}:8971"
    depends_on:
      zlmediakit:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zero-nvr

  mosquitto:
    profiles:
      - mqtt
    image: ${ZERO_NVR_MQTT_IMAGE:-eclipse-mosquitto:2.1.2-alpine}
    volumes:
      - ${ZERO_NVR_DATA_PATH:-./data/zero-nvr}/managed/mosquitto/config:/mosquitto/config:ro
      - zero-nvr-mosquitto-data:/mosquitto/data
    ports:
      - "${ZERO_NVR_MQTT_BIND:-127.0.0.1}:${ZERO_NVR_MQTT_PORT:-1883}:1883"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zero-nvr

  openlist:
    profiles:
      - openlist
    image: ${ZERO_NVR_OPENLIST_IMAGE:-openlistteam/openlist:v4.2.6}
    environment:
      UMASK: "022"
    volumes:
      - zero-nvr-openlist-data:/opt/openlist/data
    ports:
      - "${ZERO_NVR_OPENLIST_BIND:-127.0.0.1}:${ZERO_NVR_OPENLIST_PORT:-5244}:5244"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zero-nvr

  coturn:
    profiles:
      - turn
    image: ${ZERO_NVR_COTURN_IMAGE:-coturn/coturn:4.18.0-r0}
    user: "0:0"
    command:
      - -c
      - /etc/coturn/turnserver.conf
    volumes:
      - ${ZERO_NVR_DATA_PATH:-./data/zero-nvr}/managed/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /var/lib/coturn
    ports:
      - "${ZERO_NVR_TURN_BIND:-0.0.0.0}:${ZERO_NVR_TURN_PORT:-3478}:3478/tcp"
      - "${ZERO_NVR_TURN_BIND:-0.0.0.0}:${ZERO_NVR_TURN_PORT:-3478}:3478/udp"
      - "${ZERO_NVR_TURN_BIND:-0.0.0.0}:${ZERO_NVR_TURN_RELAY_MIN_PORT:-49160}-${ZERO_NVR_TURN_RELAY_MAX_PORT:-49200}:${ZERO_NVR_TURN_RELAY_MIN_PORT:-49160}-${ZERO_NVR_TURN_RELAY_MAX_PORT:-49200}/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          turnutils_stunclient 127.0.0.1 -p 3478 >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zero-nvr

  postgres:
    profiles:
      - postgres
    image: ${ZERO_NVR_POSTGRES_IMAGE:-postgres:17.11-alpine3.24}
    environment:
      POSTGRES_DB: ${ZERO_NVR_POSTGRES_DB:-zero_nvr}
      POSTGRES_USER: ${ZERO_NVR_POSTGRES_USER:-zero_nvr}
      POSTGRES_PASSWORD: ${ZERO_NVR_POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${ZERO_NVR_POSTGRES_PASSWORD_FILE:-}
    volumes:
      - zero-nvr-postgres-data:/var/lib/postgresql/data
      - ${ZERO_NVR_DATA_PATH:-./data/zero-nvr}/bootstrap-secrets:/var/lib/zero-nvr/bootstrap-secrets:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$POSTGRES_USER"
          -d "$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zero-nvr

  zlmediakit:
    image: ${ZERO_NVR_ZLM_IMAGE:-zlmediakit/zlmediakit:master}
    env_file:
      - .env
    volumes:
      - ./deploy/zlm/config.ini:/opt/media/conf/config.ini:ro
      - ${ZERO_NVR_RECORDINGS_PATH:-./data/recordings}:/recordings
      - zero-nvr-prebuffer:/prebuffer
    ports:
      - "${ZERO_NVR_ZLM_HTTP_BIND:-127.0.0.1}:${ZERO_NVR_ZLM_HTTP_PORT:-8080}:80"
      - "${ZERO_NVR_ZLM_RTSP_BIND:-127.0.0.1}:${ZERO_NVR_ZLM_RTSP_PORT:-8554}:554"
      - "${ZERO_NVR_ZLM_WEBRTC_PORT:-8001}:${ZERO_NVR_ZLM_WEBRTC_PORT:-8001}/udp"
      - "${ZERO_NVR_ZLM_WEBRTC_PORT:-8001}:${ZERO_NVR_ZLM_WEBRTC_PORT:-8001}/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST
          --data-urlencode "secret=$$ZERO_NVR_ZLM_API_SECRET"
          http://127.0.0.1/index/api/version >/dev/null
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zero-nvr

volumes:
  zero-nvr-frigate-config:
  zero-nvr-mosquitto-data:
  zero-nvr-openlist-data:
  zero-nvr-postgres-data:

  zero-nvr-prebuffer:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=${ZERO_NVR_PREBUFFER_SIZE:-512m},mode=1770"

networks:
  zero-nvr:
    driver: bridge
