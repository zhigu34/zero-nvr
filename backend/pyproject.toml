[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zero-nvr"
version = "0.1.0"
description = "Lightweight self-hosted NVR control plane"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=42,<48",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "huey>=2.5,<3",
  "pydantic-settings>=2.6,<3",
  "pwdlib[argon2]>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
