[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zero-nvr"
version = "0.1.0"
description = "Lightweight self-hosted NVR control plane"
requires-python = ">=3.12"
dependencies = [
  "apprise>=1.9,<2",
  "authlib>=1.8,<2",
  "alembic>=1.13,<2",
  "cryptography>=42,<48",
  "croniter>=3,<7",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "httpx2>=2.13,<3",
  "huey>=2.5,<3",
  "itsdangerous>=2.2,<3",
  "onvif-zeep-async>=4.2.1,<5",
  "paho-mqtt>=2.1,<3",
  "PyYAML>=6,<7",
  "WSDiscovery>=2.1.1,<3",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
