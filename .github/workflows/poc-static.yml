name: POC Static Checks

on:
  push:
    paths:
      - "poc/**"
      - "docs/plans/01-design-freeze-poc.md"
      - "docs/poc-results/**"
      - ".github/workflows/poc-static.yml"
  pull_request:
    paths:
      - "poc/**"
      - "docs/plans/01-design-freeze-poc.md"
      - "docs/poc-results/**"
      - ".github/workflows/poc-static.yml"

jobs:
  static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile POC Python
        run: |
          python -m compileall -q poc/zlm-recording/app
          python -m compileall -q poc/sqlite-load

      - name: Validate shell syntax
        run: |
          set -eu
          for script in             poc/zlm-recording/scripts/*.sh             poc/sqlite-load/run.sh             poc/run-design-freeze.sh
          do
            echo "checking $script"
            sh -n "$script"
          done

      - name: Validate Docker Compose model
        run: |
          cp poc/zlm-recording/.env.example poc/zlm-recording/.env
          docker compose             --env-file poc/zlm-recording/.env             -f poc/zlm-recording/docker-compose.yml             config >/dev/null

      - name: Verify POC result inventory
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              "01-zlm-recording.md",
              "02-fmp4-crash.md",
              "03-event-preroll.md",
              "04-multi-event-extension.md",
              "05-timeline-precision.md",
              "06-zlm-vod-seek.md",
              "07-remote-restore.md",
              "08-stream-sharing.md",
              "09-sqlite-load.md",
              "10-reconciliation.md",
          }

          root = Path("docs/poc-results")
          actual = {path.name for path in root.glob("[0-9][0-9]-*.md")}
          missing = expected - actual
          if missing:
              raise SystemExit(f"missing POC result docs: {sorted(missing)}")

          for name in sorted(expected):
              text = (root / name).read_text(encoding="utf-8")
              if "Result:" not in text:
                  raise SystemExit(f"{name} has no Result field")
          PY
