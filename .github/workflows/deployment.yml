name: Deployment

on:
  push:
    paths:
      - "deploy.sh"
      - ".env.example"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/deployment.yml"
  pull_request:
    paths:
      - "deploy.sh"
      - ".env.example"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/deployment.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment environment
        shell: bash
        run: |
          cp .env.example .env
          mkdir -p data/zero-nvr/managed/frigate
          : > data/zero-nvr/managed/frigate/runtime.env
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".env")
          text = path.read_text()
          values = {
              "ZERO_NVR_SECRET_KEY": "a" * 64,
              "ZERO_NVR_ZLM_API_SECRET": "b" * 64,
              "ZERO_NVR_ZLM_HOOK_SECRET": "c" * 64,
          }
          lines = []
          for line in text.splitlines():
              key = line.split("=", 1)[0] if "=" in line else None
              if key in values:
                  line = f"{key}={values[key]}"
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n deploy.sh
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Validate database migration CLI surface
        shell: bash
        run: |
          ./scripts/database-migrate.sh sqlite --help >/tmp/database-migrate-help
          grep -Fq "postgres|sqlite" /tmp/database-migrate-help
          ./deploy.sh help | grep -Fq "database migrate"

      - name: Test deployment state helpers
        shell: bash
        run: |
          bash scripts/test-deployment-state.sh
          bash scripts/test-feature-profiles.sh
          bash scripts/test-rollback.sh

      - name: Validate Compose model
        shell: bash
        run: |
          docker compose --env-file .env -f docker-compose.yml config --quiet
          COMPOSE_PROFILES=frigate,mqtt,openlist,postgres \
            docker compose --env-file .env -f docker-compose.yml \
            config --format json > /tmp/zero-nvr-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(
              Path("/tmp/zero-nvr-compose.json").read_text()
          )
          api_command = " ".join(
              model["services"]["zero-nvr"]["command"]
          )
          worker_command = " ".join(
              model["services"]["zero-nvr-worker"]["command"]
          )
          assert "alembic upgrade head" not in api_command
          assert "uvicorn app.main:app" in api_command
          assert "python -m app.cli check-schema" in worker_command

          assert model["services"]["frigate"]["profiles"] == ["frigate"]
          assert model["services"]["mosquitto"]["profiles"] == ["mqtt"]
          assert model["services"]["openlist"]["profiles"] == ["openlist"]
          assert model["services"]["postgres"]["profiles"] == ["postgres"]
          assert "profiles" not in model["services"]["zero-nvr"]
          assert "profiles" not in model["services"]["zero-nvr-worker"]
          assert "profiles" not in model["services"]["zlmediakit"]
          PY

      - name: Build zero-nvr image
        shell: bash
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag zero-nvr:ci \
            .

      - name: Render ZLMediaKit config from upstream image
        shell: bash
        run: |
          ZERO_NVR_ENV_FILE="$PWD/.env" ./scripts/render-zlm-config.sh
          grep -Fxq "apiDebug=0" deploy/zlm/config.ini
          grep -Fxq "enableFmp4=1" deploy/zlm/config.ini
          grep -Fxq \
            "on_play=http://zero-nvr:8000/internal/hooks/zlm/play" \
            deploy/zlm/config.ini
          grep -Fxq \
            "on_record_mp4=http://zero-nvr:8000/internal/hooks/zlm/record-mp4" \
            deploy/zlm/config.ini
          grep -Fxq \
            "on_stream_changed=http://zero-nvr:8000/internal/hooks/zlm/stream-changed" \
            deploy/zlm/config.ini
