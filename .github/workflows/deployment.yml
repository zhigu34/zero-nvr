name: Deployment

on:
  push:
    paths:
      - "deploy.sh"
      - ".env.example"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/deployment.yml"
  pull_request:
    paths:
      - "deploy.sh"
      - ".env.example"
      - ".dockerignore"
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/deployment.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment environment
        shell: bash
        run: |
          cp .env.example .env
          mkdir -p data/zero-nvr/managed/frigate
          : > data/zero-nvr/managed/frigate/runtime.env
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".env")
          text = path.read_text()
          values = {
              "ZERO_NVR_SECRET_KEY": "a" * 64,
              "ZERO_NVR_ZLM_API_SECRET": "b" * 64,
              "ZERO_NVR_ZLM_HOOK_SECRET": "c" * 64,
          }
          lines = []
          for line in text.splitlines():
              key = line.split("=", 1)[0] if "=" in line else None
              if key in values:
                  line = f"{key}={values[key]}"
              lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n deploy.sh
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          ./scripts/release-manifest.sh validate

      - name: Validate database migration CLI surface
        shell: bash
        run: |
          ./scripts/database-migrate.sh sqlite --help >/tmp/database-migrate-help
          grep -Fq "postgres|sqlite" /tmp/database-migrate-help
          ./deploy.sh help | grep -Fq "database migrate"
          ./deploy.sh help | grep -Fq "benchmark <8|16>"
          ./deploy.sh help | grep -Fq "resource-baseline"
          ./deploy.sh help | grep -Fq "resource-check static"
          ./deploy.sh help | grep -Fq "soak <8|16>"
          ./deploy.sh help | grep -Fq "small-host-soak <2|4>"
          ./deploy.sh help | grep -Fq "secret rotate"
          ./deploy.sh help | grep -Fq "recovery-kit decrypt"
          ./deploy.sh help | grep -Fq "update-preflight"
          source scripts/restore-diagnostics.sh
          test "$(restore_repository_error_code 'Fatal: wrong password or no key found')" = "repository_password_invalid"
          test "$(restore_repository_error_code 'AccessDenied: credentials rejected')" = "repository_credentials_unavailable"
          test "$(restore_repository_error_code 'RESTIC_PASSWORD is required')" = "repository_bootstrap_missing"

      - name: Test deployment state helpers
        shell: bash
        run: |
          bash scripts/test-deployment-state.sh
          bash scripts/test-artifact-pins.sh
          bash scripts/test-feature-profiles.sh
          bash scripts/test-database-migrate.sh
          bash scripts/test-rollback.sh
          bash scripts/test-benchmark.sh
          bash scripts/test-resource-baseline.sh
          python3 scripts/test_resource_check.py
          bash scripts/test-soak.sh
          python3 scripts/test_small_host_soak.py
          bash scripts/test-release-validation.sh
          bash scripts/test-release-manifest.sh
          bash scripts/test-update-preflight.sh
          bash scripts/test-port-preflight.sh
          bash scripts/test-protected-secrets.sh
          bash scripts/test-clean-install.sh

      - name: Validate Compose model
        shell: bash
        run: |
          docker compose --env-file .env -f docker-compose.yml config --quiet
          COMPOSE_PROFILES=frigate,mqtt,openlist,postgres \
            docker compose --env-file .env -f docker-compose.yml \
            config --format json > /tmp/zero-nvr-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(
              Path("/tmp/zero-nvr-compose.json").read_text()
          )
          api_command = " ".join(
              model["services"]["zero-nvr"]["command"]
          )
          worker_command = " ".join(
              model["services"]["zero-nvr-worker"]["command"]
          )
          assert "alembic upgrade head" not in api_command
          assert "uvicorn app.main:app" in api_command
          assert "python -m app.cli check-schema" in worker_command

          assert model["services"]["frigate"]["profiles"] == ["frigate"]
          assert model["services"]["mosquitto"]["profiles"] == ["mqtt"]
          assert model["services"]["openlist"]["profiles"] == ["openlist"]
          assert model["services"]["postgres"]["profiles"] == ["postgres"]
          assert "profiles" not in model["services"]["zero-nvr"]
          assert "profiles" not in model["services"]["zero-nvr-worker"]
          assert "profiles" not in model["services"]["zlmediakit"]

          zlm_healthcheck = " ".join(
              model["services"]["zlmediakit"]["healthcheck"]["test"]
          )
          assert "/opt/media/conf/config.ini" in zlm_healthcheck
          assert "ZERO_NVR_ZLM_API_SECRET" not in zlm_healthcheck

          postgres_environment = model["services"]["postgres"]["environment"]
          assert "POSTGRES_PASSWORD_FILE" in postgres_environment
          PY

      - name: Build zero-nvr image
        shell: bash
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag zero-nvr:ci \
            .

      - name: Render ZLMediaKit config from upstream image
        shell: bash
        run: |
          ZERO_NVR_ENV_FILE="$PWD/.env" ./scripts/render-zlm-config.sh
          grep -Fxq "apiDebug=0" deploy/zlm/config.ini
          grep -Fxq "enableFmp4=1" deploy/zlm/config.ini
          grep -Fxq \
            "on_play=http://zero-nvr:8000/internal/hooks/zlm/play" \
            deploy/zlm/config.ini
          grep -Fxq \
            "on_record_mp4=http://zero-nvr:8000/internal/hooks/zlm/record-mp4" \
            deploy/zlm/config.ini
          grep -Fxq \
            "on_stream_changed=http://zero-nvr:8000/internal/hooks/zlm/stream-changed" \
            deploy/zlm/config.ini


  clean-install:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Assert clean first-install state
        shell: bash
        run: |
          test ! -e .env
          test ! -e data

      - name: Run real Core clean install
        shell: bash
        run: |
          ./deploy.sh install | tee /tmp/zero-nvr-clean-install.log

      - name: Validate running Core
        shell: bash
        run: |
          test -f .env
          test "$(stat -c '%a' .env)" = "600"

          python3 - <<'PY'
          from pathlib import Path

          values = {}
          for line in Path(".env").read_text().splitlines():
              if "=" not in line:
                  continue
              key, value = line.split("=", 1)
              values[key] = value

          for key in (
              "ZERO_NVR_SECRET_KEY",
              "ZERO_NVR_ZLM_API_SECRET",
              "ZERO_NVR_ZLM_HOOK_SECRET",
          ):
              assert len(values.get(key, "")) >= 32, key

          assert values.get("ZERO_NVR_ZLM_WEBRTC_PORT") == "8001"
          PY

          curl -fsS http://127.0.0.1:8000/health

          docker compose \
            --env-file .env \
            -f docker-compose.yml \
            ps --status running --services \
            | sort > /tmp/zero-nvr-running-services

          grep -Fxq "zero-nvr" /tmp/zero-nvr-running-services
          grep -Fxq "zero-nvr-worker" /tmp/zero-nvr-running-services
          grep -Fxq "zlmediakit" /tmp/zero-nvr-running-services

          docker compose \
            --env-file .env \
            -f docker-compose.yml \
            exec -T zero-nvr \
            python -m app.cli check-schema

          test -f data/zero-nvr/deployment/release-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/zero-nvr/deployment/release-manifest.json"
          )
          value = json.loads(path.read_text())
          assert value["format"] == "zero-nvr.deployed-release"
          assert value["format_version"] == 1
          assert value["application"]["version"] == "0.1.0"
          assert len(value["identity_sha256"]) == 64
          assert len(value["source_manifest_sha256"]) == 64
          assert value["components"]["zero-nvr"]["image_id"].startswith(
              "sha256:"
          )
          assert (
              value["components"]["zero-nvr"]["image_id"]
              == value["components"]["zero-nvr-worker"]["image_id"]
          )
          assert value["components"]["zlmediakit"]["image_id"].startswith(
              "sha256:"
          )
          PY

          grep -Fq \
            "zero-nvr installed successfully" \
            /tmp/zero-nvr-clean-install.log
          grep -Fq \
            "http://localhost:8000" \
            /tmp/zero-nvr-clean-install.log
          grep -Fq \
            "ZLM WebRTC: 0.0.0.0:8001/tcp+udp" \
            /tmp/zero-nvr-clean-install.log

      - name: Show clean-install diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f .env ]]; then
            docker compose \
              --env-file .env \
              -f docker-compose.yml \
              ps || true
            docker compose \
              --env-file .env \
              -f docker-compose.yml \
              logs --no-color --tail=200 || true
          fi

      - name: Clean real install
        if: always()
        shell: bash
        run: |
          if [[ -f .env ]]; then
            docker compose \
              --env-file .env \
              -f docker-compose.yml \
              down -v --remove-orphans || true
          fi
